name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Localizar o projeto (ZIP ou pasta)
        run: |
          if [ -f music-player.zip ]; then
            rm -rf _src
            mkdir _src
            unzip -q music-player.zip -d _src
            DIR="$(find _src -maxdepth 2 -name settings.gradle.kts -printf '%h\n' | head -n 1)"
          else
            DIR="$(find . -maxdepth 2 -name settings.gradle.kts -printf '%h\n' | head -n 1)"
          fi
          if [ -z "$DIR" ]; then
            echo "Nao achei o settings.gradle.kts. Confira se o music-player.zip foi enviado."
            exit 1
          fi
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Projeto em: $DIR"

      - name: Usar o Compose 1.11 (compatível com o AGP 8.13)
        run: |
          find "$PROJECT_DIR" -type f \( -name '*.kts' -o -name '*.gradle' -o -name '*.toml' \) -exec sed -i 's/2026\.08\.00/2026.06.01/g' {} +
          echo "Linhas do Compose BOM no projeto:"
          grep -rnE 'compose-bom|composeBom' "$PROJECT_DIR" --include=*.kts --include=*.gradle --include=*.toml || true

      - name: Instalar o JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar o Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Aceitar as licencas do Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Testes unitarios
        working-directory: ${{ env.PROJECT_DIR }}
        continue-on-error: true
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Compilar o APK de debug
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Guardar o APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: music-player-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk

      - name: Guardar relatorios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-teste
          path: ${{ env.PROJECT_DIR }}/app/build/reports/tests
          if-no-files-found: ignore

      - name: Publicar o APK na aba Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${{ github.run_number }}-${{ github.run_attempt }}"
          APK="MusicPlayer-${TAG}.apk"
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" "$APK"
          gh release create "$TAG" "$APK" --title "Build ${TAG}" --notes "Commit ${GITHUB_SHA::7}. APK de teste (debug)." --prerelease
